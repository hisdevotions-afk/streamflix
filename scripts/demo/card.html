<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(60% 70% at 30% 40%, #2a2163 0%, #151231 45%, #0b0a1a 100%);
    color: #f4f3ff; font-family: Urbanist, sans-serif;
    display: grid; place-items: center; overflow: hidden;
  }
  .wrap { text-align: center; }
  .mark { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 36px; }
  .mark span { width: 26px; height: 26px; border-radius: 8px; background: #fff; }
  .mark span:last-child { background: #8b7cff; }
  h1 { margin: 0; font-weight: 800; letter-spacing: -0.035em; text-transform: uppercase; line-height: .95; }
  p { margin: 22px 0 0; color: #c9c5e6; font-weight: 500; }
  .chapter h1 { font-size: 84px; }
  .chapter p { font-size: 32px; }
  .hero h1 { font-size: 150px; }
  .hero p { font-size: 40px; }
  .stats { display: flex; gap: 72px; justify-content: center; margin-top: 56px; }
  .stats b { display: block; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
  .stats small { font-size: 22px; color: #c9c5e6; }
  .stats div:nth-child(2) b { color: #b9b0ff; }
  .line { overflow: hidden; display: block; padding-bottom: .08em; }
  .line > span { display: inline-block; transform: translateY(105%); animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
  .fade { opacity: 0; transform: translateY(14px); animation: fade .7s cubic-bezier(.16,1,.3,1) forwards; }
  .mark span { transform: scale(0); animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .mark span:nth-child(2) { animation-delay: .06s } .mark span:nth-child(3) { animation-delay: .12s } .mark span:nth-child(4) { animation-delay: .18s }
  @keyframes rise { to { transform: none } }
  @keyframes fade { to { opacity: 1; transform: none } }
  @keyframes pop { to { transform: none } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get("kind") || "chapter";
  const root = document.getElementById("root");
  root.className = "wrap " + kind;
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  let html = `<div class="mark"><span></span><span></span><span></span><span></span></div>`;
  html += `<h1><span class="line"><span style="animation-delay:.25s">${esc(q.get("title") || "")}</span></span></h1>`;
  if (q.get("sub")) html += `<p class="fade" style="animation-delay:.55s">${esc(q.get("sub"))}</p>`;
  if (q.get("stats")) {
    html += `<div class="stats">` + q.get("stats").split("|").map((s, i) => {
      const [n, l] = s.split("~");
      return `<div class="fade" style="animation-delay:${0.8 + i * 0.12}s"><b>${esc(n)}</b><small>${esc(l)}</small></div>`;
    }).join("") + `</div>`;
  }
  root.innerHTML = kind === "bg" ? "" : html;
</script>
</body>
</html>
